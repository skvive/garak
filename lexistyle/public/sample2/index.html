<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LEXID Hero Preview</title>
<style>

.card h2{font-size:clamp(22px,3.2vw,36px);margin:0 0 10px;line-height:1.25}
.card p{font-size:13px;line-height:1.55;margin:0;max-width:42ch;opacity:.85}

<body><div class="wrap">
<h1>LEXID · Hero video preview (glass card overlay)</h1>
<div class="stage">
<video src="./lexid-hero.mp4" autoplay muted loop playsinline controls></video>
